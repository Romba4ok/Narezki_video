name: narezki
# 12:00 / 17:00 / 21:00 Asia/Almaty (UTC+5), one clip per run. GitHub cron is often late or skipped (Music_video had the same):
# an external pinger (cron-job.org POST .../actions/workflows/narezki.yml/dispatches) can call workflow_dispatch too, state.json prevents repeats.
on:
  schedule:
    - cron: "0 7,12,16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (list only) | draft | queue | now. Empty = repo variable NAREZKI_BUFFER, else draft"
        default: ""
      count:
        description: how many clips in this run (empty = per_run from config.json)
        default: ""
concurrency:
  group: narezki
  cancel-in-progress: false
permissions:
  contents: write   # state.json is committed back
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: python -m pytest -q tests
      - name: Clips -> 9:16 -> Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NAREZKI_BUFFER: ${{ github.event.inputs.mode || vars.NAREZKI_BUFFER || 'draft' }}
          NAREZKI_COUNT: ${{ github.event.inputs.count }}
        run: python run.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save state (also after a failure, so the next run does not repeat a clip)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "state" && git pull --rebase && git push; }
